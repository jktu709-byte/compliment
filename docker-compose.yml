services:
  db_test:
    image: postgres:16
    profiles:
      - "test"
    networks:
      - compliment_net
    env_file:
      - ./tests.env
    tmpfs: /var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_compliment -h 127.0.0.1"]
      interval: 3s
      retries: 5
    ports:
      - 5434:5432
  db:
    image: postgres:16
    restart: always
    container_name: compliment_base
    networks:
      - compliment_net
    # Проверка контенера
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 5
    # путь к файлу с переменными бд 
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/data
    # порты пробрасываются для внешних подключений, дабы до сервиса можно было достучаться снаружи
    ports:
      - 5433:5432
  migrate:
    build: 
      context: .
      dockerfile: Dockerfile
      network: "${DOCKER_BUILD_NETWORK:-default}"
    environment:
      - PYTHONPATH=/app
    hostname: POSTGRES_HOST
    ports:
      - 5432
    env_file:
      ./.env
    command: alembic upgrade head
    networks:
      - compliment_net
    depends_on:
      db:
        condition: service_healthy
  maildev:
    image: maildev/maildev:3.0.0
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"
    container_name: complmnt_maildev
    networks:
      - compliment_net
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - compliment_net
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    networks:
      - compliment_net
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: "${DOCKER_BUILD_NETWORK:-default}"
    env_file:
      - ./.env
    command: celery -A src.celery.tasks:celery_app worker --loglevel=info
    networks:
      - compliment_net
    depends_on:
      - rabbitmq
  app:
    build: 
      context: .
      dockerfile: Dockerfile 
      network: "${DOCKER_BUILD_NETWORK:-default}"
    ports:
      - 8000:8000
    container_name: compliment
    networks:
      - compliment_net
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app
    # зависит от сервиса 
    depends_on:
      migrate:
        # пока сервис не был проверен healthcheck
        condition: service_completed_successfully
    #restart: on-failure
volumes:
  postgres_data:
  rabbitmq_data:

networks:
  compliment_net:
    driver: bridge
# Тут описываются основные стадии pipeline
stages:
  - build
  - test
  - secret-detection
  - deploy
# Сборка контейнера и основы, зависимостей
build - job:
  stage: build
  image: docker:27
  script:
    - docker compose up --build
  rules: 
    - main
# Этап тестирования
test - job:
  stage: test 
  image: python:3.12-slim
  script:
    - docker compose up db_test
    - poetry run pytest
    - docker compose down db_test
  rules: 
# Этап доставки и развертывания
deploy - job:
  stage: deploy
  script:
    - docker compose up
  rules:
    - main
# Проверка на наличие секретов
secret_detection:
  stage: secret-detection
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'

